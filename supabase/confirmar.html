<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Faxinas</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="supabase-pages.css">
</head>
<body>
<main class="container">
  <nav class="app-nav">
    <a href="index.html">Escala</a>
    <a class="active" href="confirmar.html">Minhas faxinas</a>
    <a href="multas.html">Multas</a>
  </nav>

  <section class="hero">
    <div>
      <p class="eyebrow">República • Confirmação</p>
      <h1>Minhas faxinas</h1>
      <p class="subtitle">Entre para consultar e confirmar suas tarefas.</p>
    </div>
  </section>

  <section id="loginCard" class="card auth-card">
    <h2>Entrar</h2>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="email">
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password">
    <button id="entrar">Entrar</button>
    <p id="loginStatus" class="status" aria-live="polite"></p>
  </section>

  <section id="appCard" class="card" hidden>
    <div class="top-row">
      <div>
        <h2 id="saudacao">Suas tarefas</h2>
        <p class="muted">A confirmação é definitiva e só pode ser feita dentro do prazo.</p>
      </div>
      <button id="sair" class="secondary">Sair</button>
    </div>
    <div id="tarefas"></div>
    <p id="appStatus" class="status" aria-live="polite"></p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="confirmar.js"></script>
</body>
</html>
