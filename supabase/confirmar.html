<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Faxinas</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="supabase-pages.css">
</head>
<body>
<main class="container">
  <nav class="app-nav main-nav">
    <a href="../index.html"><span class="nav-icon">▦</span><span>Escala</span></a>
    <a class="active" href="confirmar.html"><span class="nav-icon">✓</span><span>Minhas faxinas</span></a>
    <a href="multas.html"><span class="nav-icon">R$</span><span>Multas</span></a>
  </nav>
  <section class="hero"><div>
    <p class="eyebrow">República • Confirmação</p>
    <h1>Minhas faxinas</h1>
    <p class="subtitle">Escolha seu nome para consultar e confirmar suas tarefas.</p>
  </div></section>

  <section id="loginCard" class="card auth-card">
    <label for="pessoa">Quem é você?</label>
    <select id="pessoa">
      <option value="">Selecione seu nome</option>
      <option>JUKEBOX</option><option>LOTERYA</option><option>KOMIXÃO</option>
      <option>NAMOITA</option><option>NAZARÉ</option><option>CAMILA</option>
      <option>BAQUETADA</option><option>AMANDA</option><option>BELA</option>
    </select>
    <button id="entrar">Entrar</button>
    <p id="loginStatus" class="status"></p>
  </section>

  <section id="appCard" class="card" hidden>
    <div class="top-row">
      <div><h2 id="saudacao"></h2><p class="muted">A confirmação é definitiva.</p></div>
      <button id="sair" class="secondary">Trocar pessoa</button>
    </div>
    <div id="tarefas"></div><p id="appStatus" class="status"></p>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="confirmar.js"></script>
</body>
</html>
